<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent: #f2b866;
    --accent-soft: rgba(242,184,102,0.5);
    --glass: rgba(14,14,16,0.42);
    --glass-border: rgba(255,255,255,0.14);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Manrope',sans-serif;
    color:#fff;
    overflow:hidden;
    position:relative;
    background:#050505;
  }

  .video-container{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:-3;
    background:#000;
  }
  .video-container video{
    position:absolute;
    top:50%; left:50%;
    width:100vw; height:100vh;
    min-width:100%; min-height:100%;
    object-fit:cover;
    transform:translate(-50%,-50%);
    opacity:0;
    transition:opacity 1.6s ease;
    filter:saturate(1.18) contrast(1.06) brightness(0.96);
  }
  .video-container video.active{ opacity:1; }

  .overlay{
    position:absolute;
    inset:0;
    z-index:-2;
    background:
      radial-gradient(120% 90% at 50% 100%, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 55%),
      radial-gradient(140% 100% at 50% 0%, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 45%),
      linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.28));
    pointer-events:none;
  }
  .vignette{
    position:absolute;
    inset:0;
    z-index:-1;
    box-shadow: inset 0 0 18vw 2vw rgba(0,0,0,0.55);
    pointer-events:none;
  }

  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    opacity:0;
    animation:rise 1.1s ease forwards 0.25s;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .clock-shell{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .clock-container{
    position:relative;
    background:var(--glass);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    padding:44px 68px;
    border-radius:26px;
    box-shadow:
      0 24px 60px rgba(0,0,0,0.5),
      inset 0 1px 1px rgba(255,255,255,0.18),
      inset 0 -1px 12px rgba(0,0,0,0.35);
    border:1px solid var(--glass-border);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .time-display{
    font-family:'Orbitron',sans-serif;
    font-size:5rem;
    font-weight:600;
    letter-spacing:3px;
    color:#fff;
    text-shadow:0 0 24px rgba(255,255,255,0.18);
    display:flex;
    align-items:center;
    position:relative;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1, "lnum" 1;
  }
  .time-display .unit{ display:inline-flex; width:2.3ch; justify-content:center; }
  .time-display .unit.pop{ animation:pop 0.4s ease; }
  @keyframes pop{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.14); color:var(--accent); }
    100%{ transform:scale(1); }
  }

  .colon{
    color:var(--accent);
    text-shadow:0 0 14px var(--accent-soft);
    margin:0 6px;
    opacity:0.35;
    transition:opacity 0.5s ease;
  }
  .colon.on{ opacity:1; }

  .ampm{
    font-family:'Manrope',sans-serif;
    font-size:1.05rem;
    font-weight:600;
    color:#c9c9c9;
    margin-left:16px;
    letter-spacing:2px;
    align-self:flex-end;
    margin-bottom:14px;
  }

  .date-display{
    margin-top:16px;
    font-size:0.92rem;
    font-weight:400;
    color:#d4d4d4;
    letter-spacing:2px;
    text-shadow:0 2px 6px rgba(0,0,0,0.5);
  }

  .scene-tag{
    position:absolute;
    left:28px;
    bottom:26px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.78rem;
    letter-spacing:0.05em;
    color:rgba(255,255,255,0.78);
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
    opacity:0;
    transition:opacity 0.6s ease;
    z-index:5;
  }
  .scene-tag.show{ opacity:1; }
  .scene-tag .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent-soft);
  }

  .menu-overlay{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    opacity:0;
    visibility:hidden;
    transition:opacity 0.3s ease, visibility 0.3s ease;
  }
  .menu-overlay.open{ opacity:1; visibility:visible; }

  .menu-panel{
    width:320px;
    max-width:88vw;
    background:var(--glass);
    backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    border:1px solid var(--glass-border);
    border-radius:20px;
    padding:22px;
    box-shadow:0 24px 60px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.16);
    transform:translateY(10px) scale(0.97);
    transition:transform 0.3s ease;
  }
  .menu-overlay.open .menu-panel{ transform:translateY(0) scale(1); }

  .menu-header{
    font-size:0.72rem;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.6);
    margin-bottom:14px;
  }

  .menu-list{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:18px;
    max-height:280px;
    overflow-y:auto;
    padding-right:4px;
  }
  .menu-list::-webkit-scrollbar{ width:5px; }
  .menu-list::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.18); border-radius:4px; }

  .menu-group-label{
    font-size:0.66rem;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:rgba(242,184,102,0.75);
    padding:10px 12px 2px;
  }
  .menu-group-label:first-child{ padding-top:0; }
  .menu-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:10px;
    background:transparent;
    border:1px solid transparent;
    color:#eee;
    font-family:'Manrope',sans-serif;
    font-size:0.9rem;
    text-align:left;
    cursor:pointer;
    transition:background 0.2s ease, border-color 0.2s ease;
  }
  .menu-item:hover{ background:rgba(255,255,255,0.08); }
  .menu-item .dot{
    width:6px; height:6px; border-radius:50%;
    background:rgba(255,255,255,0.25);
    flex-shrink:0;
  }
  .menu-item.active{
    background:rgba(242,184,102,0.14);
    border-color:rgba(242,184,102,0.4);
    color:#fff;
  }
  .menu-item.active .dot{
    background:var(--accent);
    box-shadow:0 0 8px var(--accent-soft);
  }

  .menu-footer{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,0.12);
  }
  .menu-toggle{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:0.86rem;
    color:#ddd;
    cursor:pointer;
    user-select:none;
  }
  .menu-toggle input{
    appearance:none;
    -webkit-appearance:none;
    width:34px; height:20px;
    border-radius:999px;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.2);
    position:relative;
    cursor:pointer;
    transition:background 0.2s ease;
    flex-shrink:0;
  }
  .menu-toggle input::before{
    content:"";
    position:absolute;
    top:1px; left:1px;
    width:16px; height:16px;
    border-radius:50%;
    background:#fff;
    transition:transform 0.2s ease;
  }
  .menu-toggle input:checked{ background:var(--accent); border-color:var(--accent); }
  .menu-toggle input:checked::before{ transform:translateX(14px); }

  .menu-skip{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px 14px;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);
    color:#fff;
    font-family:'Manrope',sans-serif;
    font-size:0.86rem;
    font-weight:500;
    cursor:pointer;
    transition:background 0.2s ease, border-color 0.2s ease;
  }
  .menu-skip:hover{ background:rgba(255,255,255,0.18); border-color:rgba(255,255,255,0.3); }
  .menu-skip svg{ width:15px; height:15px; }

  .menu-hint{
    margin-top:14px;
    text-align:center;
    font-size:0.7rem;
    color:rgba(255,255,255,0.4);
    letter-spacing:0.04em;
  }

  .loading{
    position:absolute;
    top:16px; left:50%;
    transform:translateX(-50%);
    font-size:0.7rem;
    letter-spacing:0.12em;
    color:rgba(255,255,255,0.6);
    opacity:0;
    transition:opacity 0.4s ease;
    z-index:5;
    text-transform:uppercase;
  }
  .loading.show{ opacity:1; }

  @media (max-width:768px){
    .clock-container{ padding:30px 34px; border-radius:22px; }
    .time-display{ font-size:2.7rem; letter-spacing:1px; }
    .ampm{ font-size:0.8rem; margin-bottom:8px; margin-left:10px; }
    .date-display{ font-size:0.72rem; letter-spacing:1.5px; }
    .scene-tag{ left:16px; bottom:16px; font-size:0.68rem; }
    .menu-panel{ padding:18px; }
  }

  @media (prefers-reduced-motion: reduce){
    .stage{ animation:none; opacity:1; transform:none; }
    .time-display .unit.pop{ animation:none; }
    .video-container video{ transition:opacity 0.3s linear; }
  }
</style>
</head>
<body>

  <div class="video-container">
    <video id="videoA" muted playsinline preload="auto"></video>
    <video id="videoB" muted playsinline preload="auto"></video>
  </div>
  <div class="overlay"></div>
  <div class="vignette"></div>

  <div class="loading" id="loading">Loading scene</div>

  <div class="stage">
    <div class="clock-shell">
      <div class="clock-container">
        <div class="time-display">
          <span class="unit" id="hours">00</span><span class="colon" id="colon1">:</span><span class="unit" id="minutes">00</span><span class="colon" id="colon2">:</span><span class="unit" id="seconds">00</span>
          <div class="ampm" id="ampm">AM</div>
        </div>
        <div class="date-display" id="date">Loading date&hellip;</div>
      </div>
    </div>
  </div>

  <div class="scene-tag" id="sceneTag"><span class="dot"></span><span id="sceneName">Loading&hellip;</span></div>

  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-panel">
      <div class="menu-header">Scenes</div>
      <div class="menu-list" id="menuList"></div>
      <div class="menu-footer">
        <label class="menu-toggle">
          <input type="checkbox" id="loopToggle">
          <span>Loop this scene</span>
        </label>
        <button class="menu-skip" id="skipBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
          Skip to next
        </button>
      </div>
      <div class="menu-hint">Press space to close</div>
    </div>
  </div>

<script>
  const scenes = [
    { name: "Misty forest",   url: "https://videos.pexels.com/video-files/28903386/12510974_2560_1440_60fps.mp4", category: "Nature" },
    { name: "Ocean waves",    url: "https://videos.pexels.com/video-files/3571264/3571264-hd_1920_1080_30fps.mp4", category: "Nature" },
    { name: "Rainforest canopy", url: "https://videos.pexels.com/video-files/33611087/14286232_2560_1440_60fps.mp4", category: "Nature" },
    { name: "Sunset horizon", url: "https://videos.pexels.com/video-files/4068182/4068182-hd_1920_1080_30fps.mp4", category: "Nature" },
    { name: "Cascading falls", url: "https://videos.pexels.com/video-files/5762672/5762672-hd_1920_1080_25fps.mp4", category: "Nature" },
    { name: "Snowfall at night", url: "https://videos.pexels.com/video-files/6933537/6933537-uhd_2732_1440_24fps.mp4", category: "Night" },
    { name: "Starry milky way", url: "https://videos.pexels.com/video-files/13382270/13382270-uhd_2560_1440_24fps.mp4", category: "Night" },
    { name: "Rainy neon city",  url: "https://videos.pexels.com/video-files/28615179/12433511_2560_1440_25fps.mp4", category: "Cyberpunk" },
    { name: "Neon cyberpunk skyline", url: "https://videos.pexels.com/video-files/32822471/13990567_2560_1440_24fps.mp4", category: "Cyberpunk" },
    { name: "Wavy line pulse", url: "https://videos.pexels.com/video-files/28561361/12421320_2560_1440_30fps.mp4", category: "Abstract" },
    { name: "Digital plexus", url: "https://videos.pexels.com/video-files/28561594/12421541_2560_1440_30fps.mp4", category: "Abstract" },
    { name: "White line flow", url: "https://videos.pexels.com/video-files/29717489/12777829_1920_1080_30fps.mp4", category: "Abstract" },
    { name: "Dotted wave grid", url: "https://videos.pexels.com/video-files/34128903/14471920_2560_1440_30fps.mp4", category: "Abstract" }
  ];

  let order = shuffledOrder(scenes.length);
  let orderPos = 0;
  let current = 0;
  const videoA = document.getElementById('videoA');
  const videoB = document.getElementById('videoB');
  let activeEl = videoA;
  let loopMode = false;
  let menuOpen = false;
  let switching = false;
  let pendingIndex = null;

  function shuffledOrder(n){
    const arr = Array.from({length:n}, (_,i)=>i);
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function nextIndex(){
    orderPos = (orderPos + 1) % order.length;
    if(orderPos === 0) order = shuffledOrder(scenes.length);
    return order[orderPos];
  }
  function prevIndex(){
    orderPos = (orderPos - 1 + order.length) % order.length;
    return order[orderPos];
  }

  function showScene(index, attempt){
    attempt = attempt || 0;
    if(switching){
      pendingIndex = index;
      return;
    }
    switching = true;
    current = index;
    const scene = scenes[index];
    const loading = document.getElementById('loading');
    loading.classList.add('show');

    const outgoing = activeEl;
    const target = activeEl === videoA ? videoB : videoA;

    let settled = false;
    let safetyTimer = null;

    const cleanup = () => {
      clearTimeout(safetyTimer);
      target.removeEventListener('canplay', onReady);
      target.removeEventListener('error', onError);
    };

    const activateSuccess = () => {
      if(settled) return;
      settled = true;
      cleanup();
      target.loop = loopMode;
      target.play().catch(()=>{});
      target.classList.add('active');
      outgoing.classList.remove('active');
      outgoing.pause();
      activeEl = target;
      loading.classList.remove('show');
      updateSceneTag(scene.name);
      highlightMenuItem(index);
      switching = false;
      if(pendingIndex !== null){
        const next = pendingIndex;
        pendingIndex = null;
        showScene(next);
      }
    };

    const handleFailure = () => {
      if(settled) return;
      settled = true;
      cleanup();
      target.removeAttribute('src');
      switching = false;
      loading.classList.remove('show');
      // Never swap in an unready/broken clip -- whatever was already
      // playing stays visible. Try the next scene instead, bounded so a
      // string of bad links can't loop forever.
      if(pendingIndex !== null){
        const next = pendingIndex;
        pendingIndex = null;
        showScene(next);
      } else if(attempt < scenes.length){
        showScene(nextIndex(), attempt + 1);
      }
    };

    const onReady = () => activateSuccess();
    const onError = () => handleFailure();

    target.addEventListener('canplay', onReady);
    target.addEventListener('error', onError);
    target.src = scene.url;
    target.load();

    // Safety net: large clips can take a while on slower connections, but
    // if canplay/error never fires this counts as a failure -- it must
    // NOT be treated as success, or an unready frame gets shown.
    safetyTimer = setTimeout(handleFailure, 15000);
  }

  function updateSceneTag(name){
    const tag = document.getElementById('sceneTag');
    const label = document.getElementById('sceneName');
    tag.classList.remove('show');
    setTimeout(()=>{
      label.textContent = name;
      tag.classList.add('show');
    }, 250);
  }

  function goNext(){ showScene(nextIndex()); }
  function goPrev(){ showScene(prevIndex()); }

  videoA.addEventListener('ended', () => { if(activeEl === videoA) goNext(); });
  videoB.addEventListener('ended', () => { if(activeEl === videoB) goNext(); });

  const menuList = document.getElementById('menuList');
  let lastCategory = null;
  scenes.forEach((scene, i) => {
    if(scene.category !== lastCategory){
      lastCategory = scene.category;
      const label = document.createElement('div');
      label.className = 'menu-group-label';
      label.textContent = lastCategory;
      menuList.appendChild(label);
    }
    const item = document.createElement('button');
    item.className = 'menu-item';
    item.type = 'button';
    item.innerHTML = '<span class="dot"></span><span>' + scene.name + '</span>';
    item.addEventListener('click', () => {
      const pos = order.indexOf(i);
      if(pos !== -1) orderPos = pos;
      showScene(i);
      closeMenu();
    });
    menuList.appendChild(item);
  });

  function highlightMenuItem(index){
    const items = menuList.querySelectorAll('.menu-item');
    items.forEach((el, i) => el.classList.toggle('active', i === index));
  }

  showScene(order[0]);

  const menuOverlay = document.getElementById('menuOverlay');
  const loopToggle = document.getElementById('loopToggle');
  const skipBtn = document.getElementById('skipBtn');

  function openMenu(){
    menuOpen = true;
    menuOverlay.classList.add('open');
    loopToggle.checked = loopMode;
  }
  function closeMenu(){
    menuOpen = false;
    menuOverlay.classList.remove('open');
  }

  loopToggle.addEventListener('change', () => {
    loopMode = loopToggle.checked;
    activeEl.loop = loopMode;
  });

  skipBtn.addEventListener('click', () => { goNext(); });

  menuOverlay.addEventListener('click', (e) => {
    if(e.target === menuOverlay) closeMenu();
  });

  window.addEventListener('keydown', (e) => {
    if(e.code === 'Space'){
      e.preventDefault();
      if(e.repeat) return;
      menuOpen ? closeMenu() : openMenu();
    } else if(e.key === 'Escape' && menuOpen){
      closeMenu();
    }
  });

  let lastMinute = -1, lastHour = -1;
  function updateClock(){
    const now = new Date();
    let hours = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12; hours = hours ? hours : 12;

    const hEl = document.getElementById('hours');
    const mEl = document.getElementById('minutes');
    const sEl = document.getElementById('seconds');

    const hStr = String(hours).padStart(2,'0');
    const mStr = String(minutes).padStart(2,'0');
    sEl.textContent = String(seconds).padStart(2,'0');

    if(mStr !== mEl.textContent){
      mEl.textContent = mStr;
      mEl.classList.remove('pop'); void mEl.offsetWidth; mEl.classList.add('pop');
    }
    if(hStr !== hEl.textContent){
      hEl.textContent = hStr;
      hEl.classList.remove('pop'); void hEl.offsetWidth; hEl.classList.add('pop');
    }

    document.getElementById('ampm').textContent = ampm;
    document.getElementById('colon1').classList.toggle('on', seconds % 2 === 0);
    document.getElementById('colon2').classList.toggle('on', seconds % 2 === 0);

    const options = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
    document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);

  }

  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
